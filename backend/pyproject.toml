[project]
name = "memory-companion-backend"
version = "0.1.0"
description = "Memory Companion RAG platform - backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "email-validator",
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]",
  "pgvector",
  "argon2-cffi",
  "pyjwt",
  "python-multipart",
  "pypdf",
  "python-docx",
  "pillow",
  "python-magic",
  "pytesseract",
  "openai",
  "boto3",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "I", "UP"]
